<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home Screensaver Kiosk View</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --border-ui: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* The Main Interactive Frame Layout */
        .dashboard-frame {
            width: 95vw;
            height: 90vh;
            max-width: 1024px;
            max-height: 600px;
            background-color: #111827;
            border: 1px solid var(--border-ui);
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Framework Header Tabs */
        .dashboard-header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-ui);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            height: 64px;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }

        .tabs-container {
            display: flex;
            gap: 8px;
            height: 100%;
            align-items: center;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 6px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .tab-btn.active {
            background-color: var(--accent-blue);
            color: #ffffff;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        /* Main Workspace Display Content */
        .dashboard-viewport {
            flex: 1;
            position: relative;
            background-color: #0b0f19;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .view-panel {
            position: absolute;
            width: 85%;
            max-width: 700px;
            opacity: 0;
            transform: scale(0.98);
            transition: opacity 0.8s ease, transform 0.8s ease;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .view-panel.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        /* Widget Content Elements */
        .large-clock {
            font-size: 6.5rem;
            font-weight: 700;
            letter-spacing: -2px;
            color: #ffffff;
            line-height: 1;
            margin-bottom: 12px;
            text-shadow: 0 4px 24px rgba(255,255,255,0.05);
        }

        .large-date {
            font-size: 2rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .weather-value {
            font-size: 5.5rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1;
        }

        .weather-label {
            font-size: 1.8rem;
            color: #60a5fa;
            margin-top: 8px;
            font-weight: 500;
        }

        .widget-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 24px;
            color: #f59e0b;
            align-self: flex-start;
            width: 100%;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 8px;
        }

        .data-list {
            width: 100%;
            list-style: none;
            text-align: left;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 1.4rem;
        }

        .data-row:last-child {
            border-bottom: none;
        }

        .row-time {
            font-size: 1.2rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 10px;
            border-radius: 6px;
        }

        .news-box {
            text-align: left;
            width: 100%;
        }

        .news-tag {
            color: #34d399;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .news-text {
            font-size: 1.8rem;
            line-height: 1.5;
            font-weight: 500;
            color: #f1f5f9;
        }
    </style>
</head>
<body>

    <div class="dashboard-frame">
        <!-- Dashboard Top Header Bar Container -->
        <header class="dashboard-header">
            <div class="header-title">Smart Home Display</div>
            <div class="tabs-container">
                <button class="tab-btn active" id="tab-0">Clock</button>
                <button class="tab-btn" id="tab-1">Weather</button>
                <button class="tab-btn" id="tab-2">Calendar</button>
                <button class="tab-btn" id="tab-3">News</button>
            </div>
        </header>

        <!-- Main Dynamic App Rendering Window Viewport -->
        <main class="dashboard-viewport">
            
            <!-- PANEL 0: CLOCK -->
            <div class="view-panel active" id="panel-0">
                <div class="large-clock" id="live-time">00:00</div>
                <div class="large-date" id="live-date">Loading...</div>
            </div>

            <!-- PANEL 1: WEATHER -->
            <div class="view-panel" id="panel-1">
                <div class="weather-value">12°C</div>
                <div class="weather-label">🌧️ Light Rain</div>
            </div>

            <!-- PANEL 2: CALENDAR -->
            <div class="view-panel" id="panel-2">
                <div class="widget-title">Today's Schedule</div>
                <ul class="data-list">
                    <li class="data-row">
                        <span>Morning Walk</span>
                        <span class="row-time">08:30</span>
                    </li>
                    <li class="data-row">
                        <span>Bin Collection</span>
                        <span class="row-time">10:00</span>
                    </li>
                    <li class="data-row">
                        <span>Family Dinner</span>
                        <span class="row-time">18:00</span>
                    </li>
                </ul>
            </div>

            <!-- PANEL 3: NEWS -->
            <div class="view-panel" id="panel-3">
                <div class="news-box">
                    <div class="news-tag">Local Headlines</div>
                    <div class="news-text">Liverpool eco-friendly transport initiative expands to new areas across the city.</div>
                </div>
            </div>

        </main>
    </div>

    <script>
        // Real-time Clock Infrastructure Engine Logic
        function runSystemClock() {
            const timeObject = new Date();
            let hh = timeObject.getHours();
            let mm = timeObject.getMinutes();
            hh = hh < 10 ? '0' + hh : hh;
            mm = mm < 10 ? '0' + mm : mm;
            
            document.getElementById('live-time').innerText = hh + ':' + mm;

            const formatOptions = { weekday: 'long', month: 'short', day: 'numeric' };
            document.getElementById('live-date').innerText = timeObject.toLocaleDateString('en-GB', formatOptions);
        }
        setInterval(runSystemClock, 1000);
        runSystemClock();

        // High-Fidelity Active Tab Cycle Animation Engine
        const totalPanels = 4;
        let activeIndex = 0;

        function runDashboardCycle() {
            // Remove active states from previous elements
            document.getElementById(`panel-${activeIndex}`).classList.remove('active');
            document.getElementById(`tab-${activeIndex}`).classList.remove('active');

            // Shift index pointer forwards
            activeIndex = (activeIndex + 1) % totalPanels;

            // Apply active styles to target panel index
            document.getElementById(`panel-${activeIndex}`).classList.add('active');
            document.getElementById(`tab-${activeIndex}`).classList.add('active');
        }
        
        // Execution timer running sequential flips every 8 seconds
        setInterval(runDashboardCycle, 8000);
    </script>
</body>
</html>
