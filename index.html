<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home Screensaver Kiosk View</title>
    <style>
        :root {
            --bg-dark: #070a13;
            --panel-bg: rgba(15, 23, 42, 0.55);
            --border-ui: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
            --accent-blue: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* --- BACKGROUND SCENE IMAGERY SYSTEM --- */
        .scene-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: brightness(0.4) contrast(1.05);
            z-index: 0;
            transition: background-image 1.5s ease-in-out;
        }

        /* Dark overlay gradient to guarantee crisp text readability */
        .scene-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(7, 10, 19, 0.4) 0%, rgba(7, 10, 19, 0.7) 100%);
            z-index: 1;
        }

        /* Main Glassmorphic Panel Layout Container */
        .dashboard-frame {
            width: 92vw;
            height: 85vh;
            max-width: 960px;
            max-height: 540px;
            background-color: var(--panel-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-ui);
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 2;
        }

        /* Top Bar Interface Navigation */
        .dashboard-header {
            background-color: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border-ui);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 32px;
            height: 70px;
        }

        .header-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }

        .header-title::before {
            content: '';
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
        }

        .tabs-container {
            display: flex;
            gap: 12px;
            height: 100%;
            align-items: center;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
            padding: 8px 18px;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 10px;
            transition: all 0.4s ease;
        }

        .tab-btn.active {
            background-color: var(--accent-blue);
            color: #ffffff;
            border-color: var(--accent-blue);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        /* Viewport Display System Panels */
        .dashboard-viewport {
            flex: 1;
            position: relative;
            padding: 40px 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .view-panel {
            position: absolute;
            width: 90%;
            opacity: 0;
            transform: scale(0.97) translateY(5px);
            transition: opacity 1s ease-in-out, transform 1s ease-in-out;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .view-panel.active {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        /* Widgets Typography & Styles */
        .large-clock {
            font-size: 7.5rem;
            font-weight: 700;
            letter-spacing: -3px;
            color: #ffffff;
            line-height: 1;
            margin-bottom: 16px;
        }

        .large-date {
            font-size: 2.2rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .weather-value {
            font-size: 6.5rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1;
        }

        .weather-label {
            font-size: 2.2rem;
            color: #60a5fa;
            margin-top: 14px;
            font-weight: 500;
        }

        .widget-title {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 24px;
            color: #f59e0b;
            width: 100%;
            text-align: left;
            border-bottom: 1px solid var(--border-ui);
            padding-bottom: 10px;
        }

        .data-list {
            width: 100%;
            list-style: none;
            text-align: left;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 1.6rem;
        }

        .data-row:last-child {
            border-bottom: none;
        }

        .row-time {
            font-size: 1.3rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.08);
            padding: 4px 12px;
            border-radius: 8px;
        }

        .news-box {
            text-align: left;
            width: 100%;
        }

        .news-tag {
            color: #34d399;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .news-text {
            font-size: 2.2rem;
            line-height: 1.6;
            font-weight: 500;
            color: #f1f5f9;
        }
    </style>
</head>
<body>

    <!-- Smooth Ambient Photographic Background Layer Components -->
    <div class="scene-bg" id="ambient-scene"></div>
    <div class="scene-overlay"></div>

    <div class="dashboard-frame">
        <!-- Top Tab bar Architecture -->
        <header class="dashboard-header">
            <div class="header-title">Live Ambient Display</div>
            <div class="tabs-container">
                <div class="tab-btn active" id="tab-0">Clock</div>
                <div class="tab-btn" id="tab-1">Weather</div>
                <div class="tab-btn" id="tab-2">Calendar</div>
                <div class="tab-btn" id="tab-3">News</div>
            </div>
        </header>

        <!-- Main Display Views Layout -->
        <main class="dashboard-viewport">
            
            <!-- VIEW 0: CLOCK -->
            <div class="view-panel active" id="panel-0">
                <div class="large-clock" id="live-time">00:00</div>
                <div class="large-date" id="live-date">Loading...</div>
            </div>

            <!-- VIEW 1: WEATHER -->
            <div class="view-panel" id="panel-1">
                <div class="weather-value">12°C</div>
                <div class="weather-label">🌧️ Light Rain</div>
            </div>

            <!-- VIEW 2: CALENDAR -->
            <div class="view-panel" id="panel-2">
                <div class="widget-title">Today's Schedule</div>
                <ul class="data-list">
                    <li class="data-row">
                        <span>Morning Walk</span>
                        <span class="row-time">08:30</span>
                    </li>
                    <li class="data-row">
                        <span>Bin Collection</span>
                        <span class="row-time">10:00</span>
                    </li>
                    <li class="data-row">
                        <span>Family Dinner</span>
                        <span class="row-time">18:00</span>
                    </li>
                </ul>
            </div>

            <!-- VIEW 3: NEWS -->
            <div class="view-panel" id="panel-3">
                <div class="news-box">
                    <div class="news-tag">Local Headlines</div>
                    <div class="news-text">Liverpool eco-friendly transport initiative expands to new areas across the city.</div>
                </div>
            </div>

        </main>
    </div>
